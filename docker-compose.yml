version: '3'
services:
  backend:
    build: ./backend
    env_file:
      - backend/.env.dev
    ports:
      - "8080:8080"
  firebase:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install -g firebase-tools && firebase emulators:start --project svm-projections"
    ports:
      - "4000:4000" # hosting
      - "8085:8085" # firestore
